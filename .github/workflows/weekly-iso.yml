name: Weekly ISO Build

# Builds the AcreetionOS Immutable ISO in GitHub Actions once a week.
# The finished ISO (plus SHA256SUMS) is uploaded as a workflow artifact:
# Actions -> Weekly ISO Build -> latest run -> Artifacts.
# Tagged stable releases are still handled by release.yml.

on:
  schedule:
    # Sundays 20:00 UTC = 12:00 Pacific, alongside the weekly retail build
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Immutable ISO
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ISO (privileged Arch container)
        run: |
          PARENT="$(dirname "$GITHUB_WORKSPACE")"
          NAME="$(basename "$GITHUB_WORKSPACE")"
          docker run --privileged --rm \
            -v "$PARENT:/work" -w "/work/$NAME" \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed archiso grub syslinux mtools dosfstools e2fsprogs squashfs-tools libisoburn cdrtools sudo git
              git config --global --add safe.directory "*"
              ./build.sh
            '
          mkdir -p "$GITHUB_WORKSPACE/iso-out"
          cp "$PARENT"/ISO-immutable/*.iso "$GITHUB_WORKSPACE/iso-out/"
          cd "$GITHUB_WORKSPACE/iso-out"
          sha256sum *.iso > SHA256SUMS
          ls -lh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: acreetionos-immutable-iso
          path: iso-out/
          if-no-files-found: error
          retention-days: 90

      - name: Post artifact link and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ART_ID="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[0].id')"
          ART_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${ART_ID}"
          SUMS="$(cat iso-out/SHA256SUMS)"
          {
            echo "Latest weekly build of AcreetionOS Immutable, built by the Weekly ISO Build workflow."
            echo ""
            echo "- Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Download (ISO + SHA256SUMS, .zip artifact): ${ART_URL}"
            echo ""
            echo "SHA-256:"
            echo '```'
            echo "${SUMS}"
            echo '```'
            echo ""
            echo "Verify after unzipping with \`sha256sum -c SHA256SUMS\`. This is a rolling weekly build, not a stable release -- stable releases stay under their version tags."
          } > weekly-notes.md
          if gh release view weekly >/dev/null 2>&1; then
            gh release edit weekly --title "Weekly build (latest)" --notes-file weekly-notes.md
          else
            gh release create weekly --prerelease --title "Weekly build (latest)" --notes-file weekly-notes.md
          fi
