# Calamares partition module - AcreetionOS Immutable layout
---
# Only guided "erase disk" installation is offered; manual partitioning cannot
# guarantee a valid A/B layout and is therefore disabled in settings.conf.
initialPartitioningChoice: erase
initialSwapChoice: none

drawJobPane: true

# Fixed GPT layout created by the erase-disk flow:
#   ESP   1024 MiB  fat32  -> /efi         (GRUB + abroot env)
#   slotA    40 %   ext4   -> /            (installed root, read-only at runtime)
#   slotB    40 %   ext4                   (standby root for atomic updates)
#   data     15 %   ext4   -> /mnt/.data   (/home, /var, per-slot /etc overlays)
layout:
  filesystem: "ext4"
  efiPartSize: "1024MiB"
  swap: none
  partitions:
    - name: "AcreetionOS Immutable Slot A"
      filesystem: "ext4"
      attributes: [ required ]
      percent: "40%"
      mountPoint: "/"
    - name: "AcreetionOS Immutable Slot B"
      filesystem: "ext4"
      attributes: [ required ]
      percent: "40%"
    - name: "acreetion-data"
      filesystem: "ext4"
      attributes: [ required ]
      percent: "15%"
      mountPoint: "/mnt/.data"

# Requirements for guided installs
requiredStorage: 30
