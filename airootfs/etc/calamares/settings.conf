# AcreetionOS Immutable - Calamares settings
---
modules-search: [ local ]

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - hwclock
      - shellprocess@absetup
      - shellprocess@abfstab
      - shellprocess@abbootloader
      - shellprocess@abfinalize
      - umount
  - show:
      - finish

branding: acreetionos-immutable
prompt: no
dont-chroot: no
disable-cancel: no
disable-cancel-during-exec: yes

# The immutable layout is created by the "erase disk" flow only.
# Manual partitioning is disabled to prevent broken A/B layouts.
allow-erase-partition: true
allow-manual-partitioning: false
