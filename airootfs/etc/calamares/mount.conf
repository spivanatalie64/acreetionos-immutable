# Calamares mount module - pseudo filesystems bound into the target chroot.
# Real partitions are mounted by the partition module according to the
# immutable layout in partition.conf.
---
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    fs: devtmpfs
    mountPoint: /dev
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run

extraMountsEfi:
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
